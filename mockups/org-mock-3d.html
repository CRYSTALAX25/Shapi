<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapi Org Map — 3D isometric (mockup)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Plus Jakarta Sans', sans-serif;
    background:#060609; color:rgba(255,255,255,0.9);
    overflow:hidden; height:100vh;
    background-image: radial-gradient(circle, rgba(34,211,238,0.05) 1px, transparent 1px);
    background-size:44px 44px;
  }
  header {
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; background:rgba(6,6,9,0.85); backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .logo { font-weight:900; font-size:20px; letter-spacing:-0.02em;
    background:linear-gradient(135deg,#A78BFA,#22D3EE);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .hint { font-size:12px; color:rgba(255,255,255,0.4); }
  .badge { font-size:11px; font-weight:700; padding:4px 12px; border-radius:999px;
    background:rgba(52,211,153,0.13); color:#34D399; border:1px solid #34D39940; }

  #stage { position:absolute; inset:0; top:54px; perspective:1400px; cursor:grab; }
  #board {
    position:absolute; left:50%; top:54%; width:1400px; height:900px;
    transform-style:preserve-3d;
  }
  .platform {
    position:absolute; border-radius:24px; transform-style:preserve-3d;
    background:linear-gradient(135deg, rgba(34,211,238,0.05), rgba(167,139,250,0.05));
    border:1px solid rgba(167,139,250,0.18);
    box-shadow:0 60px 120px rgba(0,0,0,0.6);
  }
  .platform .plabel {
    position:absolute; top:-30px; left:18px; font-size:11px; font-weight:800;
    letter-spacing:0.18em; text-transform:uppercase; color:rgba(167,139,250,0.7);
  }
  .card3d {
    position:absolute; width:168px; padding:12px 14px; border-radius:14px;
    transform-style:preserve-3d;
    background:linear-gradient(#10101a,#10101a) padding-box,
      linear-gradient(135deg, rgba(34,211,238,0.35), rgba(167,139,250,0.35)) border-box;
    border:1.5px solid transparent;
    box-shadow:0 30px 50px rgba(0,0,0,0.65);
    transition:transform .25s;
  }
  .card3d:hover { transform:translateZ(46px) !important; }
  .card3d.verified {
    background:linear-gradient(#0d1611,#0d1611) padding-box,
      linear-gradient(135deg, rgba(52,211,153,0.7), rgba(52,211,153,0.3)) border-box;
    box-shadow:0 30px 50px rgba(0,0,0,0.65), 0 0 36px rgba(52,211,153,0.25);
  }
  .card3d .role { font-weight:800; font-size:12.5px; line-height:1.25; }
  .card3d .person { font-size:11px; color:rgba(255,255,255,0.55); margin-top:3px; }
  .card3d .meta { display:flex; gap:6px; margin-top:8px; }
  .chip { font-size:8.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
    padding:2.5px 8px; border-radius:999px; }
  .chip.v { background:rgba(52,211,153,0.18); color:#34D399; }
  .chip.sr { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.35); }
  .pillar {
    position:absolute; width:2px;
    background:linear-gradient(180deg, rgba(34,211,238,0.5), rgba(167,139,250,0.08));
    transform-origin:top;
  }
  .controls { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:50;
    display:flex; gap:10px; }
  .controls button {
    font-family:inherit; font-weight:700; font-size:12px; padding:9px 18px; cursor:pointer;
    border-radius:999px; border:1px solid rgba(255,255,255,0.12);
    background:rgba(13,13,20,0.9); color:rgba(255,255,255,0.85);
  }
  .controls button.active { background:linear-gradient(135deg,#22D3EE,#A78BFA); color:#0B0B11; border:none; }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:14px;">
    <span class="logo">shapi</span>
    <span style="font-size:13px;font-weight:700;">Org Map · Meridian Gulf · 3D</span>
    <span class="badge">Org verified: 33%</span>
  </div>
  <span class="hint">drag to orbit the camera · scroll to zoom · hover a card to lift it</span>
</header>

<div id="stage"><div id="board"></div></div>

<div class="controls">
  <button onclick="setView('iso')" id="b-iso" class="active">Isometric</button>
  <button onclick="setView('top')" id="b-top">Top-down</button>
  <button onclick="setView('side')" id="b-side">Cinematic</button>
</div>

<script>
const board = document.getElementById('board');
const stage = document.getElementById('stage');

// Platforms: one per division (the "floors" of the map)
const PLATFORMS = [
  { id:'exec',  label:'Executive',        x:480, y:40,  w:380, h:200, z:120 },
  { id:'ops',   label:'Operations · Dubai', x:60,  y:360, w:420, h:340, z:0 },
  { id:'eng',   label:'Engineering · Riyadh', x:540, y:360, w:420, h:340, z:0 },
  { id:'sales', label:'Sales · Dubai',     x:1020, y:360, w:330, h:340, z:0 },
];
const CARDS = [
  { role:'Chief Executive', person:'Omar Al-Rashid', v:true,  plat:'exec', x:100, y:50, z:40 },
  { role:'Head of Operations', person:'Sara Haddad', v:true,  plat:'ops', x:120, y:30, z:30 },
  { role:'Logistics Manager', person:'Fatima Noor',  v:true,  plat:'ops', x:30,  y:180, z:0 },
  { role:'Facilities Lead', person:'Hassan Ali',     v:false, plat:'ops', x:230, y:180, z:0 },
  { role:'Head of Engineering', person:'Layla Mansour', v:false, plat:'eng', x:120, y:30, z:30 },
  { role:'Senior Back Engineer', person:'Yusuf Khan', v:true,  plat:'eng', x:30,  y:180, z:0 },
  { role:'Data Analyst', person:'— vacant —',        v:false, plat:'eng', x:230, y:180, z:0 },
  { role:'Head of Sales', person:'Karim Aziz',       v:false, plat:'sales', x:80, y:30, z:30 },
  { role:'Account Executive', person:'Mariam Said',  v:false, plat:'sales', x:80, y:180, z:0 },
];

PLATFORMS.forEach(p => {
  const d = document.createElement('div');
  d.className = 'platform';
  d.style.cssText = `left:${p.x}px; top:${p.y}px; width:${p.w}px; height:${p.h}px;
    transform: translateZ(${p.z}px);`;
  d.innerHTML = `<span class="plabel">${p.label}</span>`;
  board.appendChild(d);
  p.el = d;
});
CARDS.forEach(c => {
  const p = PLATFORMS.find(x => x.id === c.plat);
  const d = document.createElement('div');
  d.className = 'card3d' + (c.v ? ' verified' : '');
  d.style.cssText = `left:${p.x + c.x}px; top:${p.y + c.y}px;
    transform: translateZ(${p.z + 26 + c.z}px);`;
  d.innerHTML = `<div class="role">${c.role}</div><div class="person">${c.person}</div>
    <div class="meta"><span class="chip ${c.v?'v':'sr'}">${c.v?'✓ Verified':'Self-reported'}</span></div>`;
  board.appendChild(d);
  // support pillar — gives the "floating card" depth cue
  const pl = document.createElement('div');
  pl.className = 'pillar';
  pl.style.cssText = `left:${p.x + c.x + 84}px; top:${p.y + c.y + 30}px;
    height:${p.z + 26 + c.z}px;
    transform: rotateX(-90deg) translateY(${(p.z + 26 + c.z)/2}px);`;
  board.appendChild(pl);
});

let rx = 52, rz = -38, zoom = 0.82, dragging = null;
const VIEWS = { iso:{rx:52,rz:-38,zoom:0.82}, top:{rx:8,rz:0,zoom:0.78}, side:{rx:68,rz:-24,zoom:0.95} };
function apply(){
  board.style.transform =
    `translate(-50%,-50%) scale(${zoom}) rotateX(${rx}deg) rotateZ(${rz}deg)`;
}
apply();
function setView(k){
  const v = VIEWS[k]; rx=v.rx; rz=v.rz; zoom=v.zoom; apply();
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
  document.getElementById('b-'+k).classList.add('active');
}
stage.addEventListener('pointerdown', e => { dragging = { x:e.clientX, y:e.clientY }; stage.style.cursor='grabbing'; });
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  rz += (e.clientX - dragging.x) * 0.25;
  rx = Math.min(80, Math.max(5, rx - (e.clientY - dragging.y) * 0.18));
  dragging = { x:e.clientX, y:e.clientY };
  apply();
});
window.addEventListener('pointerup', () => { dragging = null; stage.style.cursor='grab'; });
stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.min(1.5, Math.max(0.4, zoom * (e.deltaY > 0 ? 0.93 : 1.07)));
  apply();
}, { passive:false });
</script>
</body>
</html>
